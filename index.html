<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>神跡酒造周邊｜3D 導覽地圖</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Microsoft JhengHei',system-ui,sans-serif;background:#d8eef0;color:#234336}#app{position:fixed;inset:0}canvas{display:block}.header{position:fixed;z-index:5;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}.title,.buttons{pointer-events:auto}.title{background:#fffdf4ee;border:2px solid white;border-radius:18px;padding:12px 16px;box-shadow:0 5px 16px #244a3833}.title h1{font-size:clamp(16px,3vw,23px);margin:0}.title small{color:#597b68}.buttons{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}button,.link{font:inherit;border:0;border-radius:11px;padding:10px 12px;background:#fffdf4;color:#254535;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 3px 10px #244a3825}.link{background:#cde9ce;display:inline-block}button:hover,.link:hover{filter:brightness(.95)}#info{display:none;position:fixed;z-index:10;right:18px;top:100px;width:min(355px,calc(100vw - 36px));background:#fffdf6;border:3px solid white;border-radius:22px;padding:18px;box-shadow:0 15px 40px #23433655}#info.show{display:block}#info h2{margin:8px 0}#info p{line-height:1.7}#close{float:right;background:#f5e5d9}#hint{position:fixed;z-index:4;bottom:14px;left:50%;transform:translateX(-50%);background:#fffdf4ee;border-radius:99px;padding:10px 16px;text-align:center;font-size:13px;max-width:95vw;box-shadow:0 4px 15px #244a3825}#error{display:none;position:fixed;z-index:30;inset:15%;background:white;padding:20px;border-radius:15px}@media(max-width:650px){.header{top:8px;left:8px;right:8px}.title{padding:9px}.buttons button{padding:8px;font-size:12px}#info{top:auto;bottom:65px;right:9px;max-height:60vh;overflow:auto}}
</style>
</head>
<body>
<div id="app"></div>
<div class="header"><div class="title"><h1>🌿 神跡酒造周邊 3D 導覽</h1><small>卡通觀光地圖・點景點名稱看介紹</small></div><div class="buttons"><button id="reset">⌂ 全景</button><button id="names">名稱：開</button></div></div>
<section id="info"><button id="close">✕</button><small id="category"></small><h2 id="placeName"></h2><p id="description"></p><a class="link" id="navigate" target="_blank" rel="noopener noreferrer">📍 Google 地圖查看</a></section>
<div id="hint">🖱️ 拖曳旋轉 · 滾輪縮放 · 點擊景點「名稱」或標記</div>
<div id="error"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ★ 修改景點資訊只需要編輯這個陣列 ★
// pos 是示意地圖的位置，不是真實 GPS 座標。
const places = [
  {name:'神跡酒造',category:'🍶 釀造文化',pos:[-2,2],color:'#d77555',icon:'🍶',description:'以地方釀造文化為主題的導覽起點，可認識品牌故事、釀造工藝與地方產業特色。參觀方式及開放時間請事先向業者確認。',search:'神跡酒造 台中'},
  {name:'水流東桐花步道',category:'🌿 自然步道',pos:[-7,-3],color:'#6baf75',icon:'🌿',description:'適合安排自然散步、觀察植物與季節景觀的步道。實際步道狀況、花況與交通資訊請出發前確認。',search:'水流東桐花步道 台中'},
  {name:'無極三清總道院',category:'⛩️ 人文景點',pos:[-6,4],color:'#e1ad59',icon:'⛩️',description:'可安排欣賞宗教建築與認識地方信仰文化。參觀時請遵守場域規範。',search:'無極三清總道院 台中'},
  {name:'外埔忘憂谷',category:'🌾 田園風景',pos:[4,-4],color:'#83b75f',icon:'🌾',description:'以開闊田野景觀為特色的戶外觀景地點。請依道路與農作區規範通行，避免進入私人農地。',search:'外埔忘憂谷 台中'},
  {name:'ST Workshop 手作烘焙坊',category:'🍰 休憩美食',pos:[5,4],color:'#df9c65',icon:'🍰',description:'可作為旅途中的休憩與美食停留點。營業資訊與供應品項請以店家最新公告為準。',search:'ST Workshop 手作烘焙坊 台中'}
];

const scene=new THREE.Scene();scene.background=new THREE.Color('#d8eef0');
const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.1,100);camera.position.set(14,16,19);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.getElementById('app').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.5,0);controls.enableDamping=true;controls.minDistance=8;controls.maxDistance=35;controls.maxPolarAngle=Math.PI*.48;
scene.add(new THREE.HemisphereLight('#ffffff','#719a77',2.4));const sun=new THREE.DirectionalLight('#fff6dc',3);sun.position.set(-7,16,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const world=new THREE.Group();scene.add(world);
const material=color=>new THREE.MeshStandardMaterial({color,roughness:1,flatShading:true});
function box(w,h,d,color,x,y,z,rotation=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));m.position.set(x,y,z);m.rotation.y=rotation;m.castShadow=true;m.receiveShadow=true;world.add(m);return m}
box(22,.8,18,'#d5b786',0,-.48,0);box(21.7,.12,17.7,'#a6d78f',0,-.04,0);
box(12,.04,1.05,'#f4d8a7',-1,.04,2.1,-.08);box(1.1,.04,8,'#f4d8a7',4.6,.05,0);box(7,.04,1,'#f4d8a7',-3,.05,-2.6,-.2);box(1,.04,5.5,'#f4d8a7',-5.8,.05,.2);
box(1.6,.06,15,'#88cbdc',8.8,.05,0);box(2.2,.2,1.3,'#cf9f70',8.2,.19,2);
function hill(x,z,sx,sy,sz,color){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(1,1),material(color));m.scale.set(sx,sy,sz);m.position.set(x,sy*.38,z);m.castShadow=true;world.add(m)}
hill(-8,-5,3,2.3,2.7,'#7fbe75');hill(-5.5,-6,2.5,1.8,2,'#91cb82');hill(4,-6,3,2,2.5,'#84c17a');hill(-8,6,2.6,1.7,2.2,'#90ca7b');
function tree(x,z,s=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.11*s,.16*s,.65*s,6),material('#a57a54'));trunk.position.set(x,.33*s,z);world.add(trunk);const leaves=new THREE.Mesh(new THREE.IcosahedronGeometry(.56*s,0),material('#55a76b'));leaves.position.set(x,.94*s,z);leaves.castShadow=true;world.add(leaves)}
[[-9,-2],[-9,2],[-7,0],[-4,-6],[-1,-6],[2,-6],[7,-6],[7,6],[-7,6],[-4,5],[2,6],[6,1]].forEach((p,i)=>tree(...p,i%3===0?1.2:.9));
function house(x,z,wall,roof){box(1.7,1.1,1.4,wall,x,.56,z);const r=new THREE.Mesh(new THREE.ConeGeometry(1.3,.8,4),material(roof));r.rotation.y=Math.PI/4;r.position.set(x,1.5,z);r.castShadow=true;world.add(r);box(.3,.6,.08,'#84583c',x,.35,z+.73)}
house(-2,2,'#fff0cf','#bd6853');house(5,4,'#ffe4b9','#d29a57');
for(let i=0;i<4;i++)for(let j=0;j<3;j++)box(.7,.05,.5,(i+j)%2?'#b4d17d':'#88be6e',3.5+i*.8,.08,-4.7+j*.6);

// Canvas 文字標籤：可被 Raycaster 直接點擊。
function labelSprite(text){const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=256;const ctx=canvas.getContext('2d');ctx.fillStyle='#fffdf4';ctx.strokeStyle='#48755c';ctx.lineWidth=10;ctx.beginPath();ctx.roundRect(12,12,1000,232,55);ctx.fill();ctx.stroke();ctx.fillStyle='#244633';ctx.font='bold 69px Microsoft JhengHei, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,512,128,940);const tex=new THREE.CanvasTexture(canvas);tex.colorSpace=THREE.SRGBColorSpace;const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));sprite.scale.set(4.6,1.15,1);sprite.renderOrder=10;return sprite}
const clickable=[];const sprites=[];
places.forEach((p)=>{const group=new THREE.Group();group.position.set(p.pos[0],0,p.pos[1]);world.add(group);const disc=new THREE.Mesh(new THREE.CylinderGeometry(.42,.48,.22,12),material('#fff6d9'));disc.position.y=.18;group.add(disc);const ball=new THREE.Mesh(new THREE.SphereGeometry(.37,12,10),material(p.color));ball.position.y=.67;group.add(ball);const label=labelSprite(p.name);label.position.set(0,1.72,0);group.add(label);sprites.push(label);for(const obj of [disc,ball,label]){obj.userData.place=p;clickable.push(obj)}});
const panel=document.getElementById('info');
function openPlace(p){document.getElementById('category').textContent=p.category;document.getElementById('placeName').textContent=p.name;document.getElementById('description').textContent=p.description;document.getElementById('navigate').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.search);panel.classList.add('show')}
document.getElementById('close').onclick=()=>panel.classList.remove('show');document.getElementById('reset').onclick=()=>{camera.position.set(14,16,19);controls.target.set(0,.5,0);controls.update();panel.classList.remove('show')};let labelsVisible=true;document.getElementById('names').onclick=()=>{labelsVisible=!labelsVisible;sprites.forEach(s=>s.visible=labelsVisible);document.getElementById('names').textContent='名稱：'+(labelsVisible?'開':'關')};
const raycaster=new THREE.Raycaster();const mouse=new THREE.Vector2();let startX=0,startY=0;
renderer.domElement.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-startX,e.clientY-startY)>7)return;const rect=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(clickable,false);if(hits.length)openPlace(hits[0].object.userData.place)});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
</body></html>
